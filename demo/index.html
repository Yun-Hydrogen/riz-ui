<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RizUI — Vue3 组件预览</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Microsoft YaHei', sans-serif;
      background: #f3f5f8;
      color: #334;
    }
    html[data-rizui-theme="dark"] body { background: #161d27; color: #e6ebf2; }
  </style>
  <script>
    /* 提前恢复演示主题，避免暗色模式刷新时闪烁（与 App.vue 的 localStorage 键一致） */
    (function () {
      try {
        var t = localStorage.getItem('rizui-demo-theme')
        if (t === 'dark') document.documentElement.setAttribute('data-rizui-theme', 'dark')
        else if (t === 'light') document.documentElement.setAttribute('data-rizui-theme', 'light')
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
